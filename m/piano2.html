<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Piano</title>
  <meta
    name="description"
    content="Ein simples Musikinstrument für experimentelle Zwecke">
  <link href="/m/piano2.html" rel="canonical">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="/favicon.png" rel="shortcut icon" type="image/png"/>
  <link href="/favicon.ico" rel="shortcut icon"/>
  <style>
    .white {
      background: white;
    }

    .black {
      background: #555;
    }

    .playing {
      background: #AAA;
    }

    #container {
      position: absolute;
      top: 30px;
      left: 10px;
    }

    .knob {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      border: 2px solid black;
      text-align: center;
      font-size: 40px;
      line-height: 60px;
    }
  </style>
  <script src="https://unpkg.com/tone"></script>
</head>
<body>
<div id="container">
</div>
<script>
  // https://www.youtube.com/watch?v=wIxqNrooWws
  // https://jsfiddle.net/shaiui/0z8x352n/
  // https://cdnjs.com/libraries/tone
  // https://tonejs.github.io/


  var size = 60;
  var synth = new Tone.PolySynth(Tone.Synth, 3).toDestination();
  var notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var html = '';

  function set_handlers(name) {
    const el = document.getElementById(name);
    el.ontouchstart = start_handler;
    el.ontouchmove = move_handler;
    el.ontouchcancel = end_handler;
    el.ontouchend = end_handler;
  }

  for (var row = 0; row < 9; row++) {
    for (var i = -(row >> 1); i < 10 - (row >> 1); i++) {
      var note = notes[(row * 4 + i * 7) % 12];
      octave = Math.floor((row * 4 + i * 7) / 12) + 2;
      var color = note.length > 1 ? 'black' : 'white'
      html += `<div id="note-${row}-${i}"
                    class="${color} knob"
                    style="left:${(i * 1.2 + row * 0.6625) * size}px; top:${(row - i * 0.05) * size}px;"
                    data-note="${note + octave}">${note}</div>`;
    }
  }
  document.getElementById('container').innerHTML = html;

  for (var row = 0; row < 9; row++) {
    for (var i = -(row >> 1); i < 10 - (row >> 1); i++) {
      set_handlers(`note-${row}-${i}`);
    }
  }

  function start_handler(ev) {
    ev.preventDefault();
    noteDown(ev.target);
  }

  function move_handler(ev) {
    ev.preventDefault();
  }

  function end_handler(ev) {
    ev.preventDefault();
    noteUp(ev.target);
  }
  function noteUp(elem) {
    elem.classList.remove('playing');
    const note = elem.dataset.note;
    const now = Tone.now();
    synth.triggerRelease(note, now);
  }

  function noteDown(elem) {
    elem.classList.add('playing');
    const note = elem.dataset.note;
    const now = Tone.now();
    synth.triggerAttack(note, now);
  }

</script>
</body>
</html>
