<!DOCTYPE html>
<html lang="en">
<head>
  <title>Der fliegende Diamant</title>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="/favicon.png" rel="shortcut icon" type="image/png"/>
  <link href="/favicon.ico" rel="shortcut icon"/>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
    crossorigin="anonymous">
  <style>
    .bg-gray {
      background-color: #ddc;
    }


    .dreieck {
      stroke: #99AACC;
      pointer-events: none;
      stroke-linejoin: bevel;
      transition: 1s;
    }

    @keyframes openYourHeart {
      from {
        r: 0
      }
      to {
        r: 60px
      }
    }

    #myClip circle {
      animation: openYourHeart 15s infinite;
    }
  </style>
</head>

<body class="bg-gray p-3">
<svg width="90%" viewBox="0 0 160 40">
  <defs>
    <pattern id="pattern1" height="100%" width="100%" patternContentUnits="objectBoundingBox">
      <image
        height="1" width="1" preserveAspectRatio="none"
        xlink:href="https://pbs.twimg.com/profile_images/1188883075004096516/SsiqytBV_400x400.jpg"/>
    </pattern>
  </defs>

  <polygon points="50 10 70 10 40 40" id="sib5a" class="sib" fill="#00000000"/>
  <polygon points="50 10 70 10 40 40" id="d5a" class="dreieck" fill="url(#pattern1)"/>
</svg>

<svg width="20vw" viewBox="0 0 100 100">
  <clipPath id="myClip">
    <!--
      Everything outside the circle will be
      clipped and therefore invisible.
    -->
    <circle cx="40" cy="35" r="35"/>
  </clipPath>

  <!-- The original black heart, for reference -->
  <path id="heart" d="M10,30 A20,20,0,0,1,50,30 A20,20,0,0,1,90,30 Q90,60,50,90 Q10,60,10,30 Z"/>

  <!--
    Only the portion of the red heart
    inside the clip circle is visible.
  -->
  <use clip-path="url(#myClip)" href="#heart" fill="red"/>
</svg>

<div class="mt-5">
  Spielomat (unfertig)
</div>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
  crossorigin="anonymous"></script>
</body>
</html>
