<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Knopf-Piano</title>
  <meta
    name="description"
    content="Ein simples Musikinstrument für experimentelle Zwecke">
  <link href="/piano/" rel="canonical">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="/favicon.png" rel="shortcut icon" type="image/png"/>
  <link href="/favicon.ico" rel="shortcut icon"/>
  <style>
    .white {
      background: white;
    }

    .black {
      background: #555;
    }

    .playing {
      background: #AAA;
    }

    #outer-container {
      position: relative;
    }

    #container {
      position: absolute;
      top: 30px;
      left: 10px;
    }

    .knob {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      border: 2px solid black;
      text-align: center;
      font-size: 0;
      line-height: 60px;
      overflow: hidden;
    }

    .knob-label {
      pointer-events: none;

      &.note {
        font-size: 32px;
      }

      &.octave {
        font-size: 20px;
      }
    }

  </style>
  <script src="https://unpkg.com/tone"></script>
</head>
<body>
<button onclick="reset()" id="start">Start</button>
<br>

<button onclick="decrease('slider-dx')">-</button>
<input id="slider-dx" type="range" value="3" min="0" max="12" step="1" onchange="reset()">
<button onclick="increase('slider-dx')">+</button>
&nbsp;
<label for="slider-dx">DX</label>=<span id="slider-dx-value">7</span>  (Richtung Rechts)
<br>

<button onclick="decrease('slider-dy')">-</button>
<input id="slider-dy" type="range" value="5" min="0" max="12" step="1" onchange="reset()">
<button onclick="increase('slider-dy')">+</button>
&nbsp;
<label for="slider-dy">DY</label>=<span id="slider-dy-value">7</span> (Richtung rechts unten)
<br>

<button>-</button>
<input id="slider-dz" type="range" value="5" min="0" max="12" step="1" disabled>
<button>+</button>
&nbsp;
<label for="slider-dy">DZ</label>=<span id="slider-dz-value">7</span> (Richtung links unten)
<br>

<button onclick="decrease('slider-octave')">-</button>
<input id="slider-octave" type="range" value="0" min="-7" max="7" step="1" onchange="reset()">
<button onclick="increase('slider-octave')">+</button>
&nbsp;
<label for="slider-octave">Octave offset</label>=<span id="slider-octave-value">0</span>
<br>

<button onclick="decrease('slider-trail')">-</button>
<input id="slider-trail" type="range" value="3" min="1" max="20" step="1" onchange="reset()">
<button onclick="increase('slider-trail')">+</button>
&nbsp;
<label for="slider-trail">Maximale noten: </label> Die letzten <span id="slider-trail-value">3</span>

<div id="outer-container">
  <div id="container">
  </div>
</div>
<script>
  // https://www.youtube.com/watch?v=wIxqNrooWws
  // https://jsfiddle.net/shaiui/0z8x352n/
  // https://cdnjs.com/libraries/tone
  // https://tonejs.github.io/


  let size = 60;
  const rows = 13;
  const cols = 13;
  let notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const intervals = [
    '(0 ht) 1 / 8',
    '(1 ht) + / j7',
    '(2 ht) 2 / 7',
    '(3 ht) m / 6',
    '(4 ht) D / 5+',
    '(5 ht) 4 / 5',
    '(6 ht) 5- / 5-',
    '(7 ht) 5 / 4',
    '(8 ht) 5+ / D',
    '(9 ht) 6 / m',
    '(10 ht) 7 / 2',
    '(11 ht) j7 / +',
    '(12 ht) 8 / 1',
  ]
  let html = '';
  let synth;
  const playing = new Map();

  function set_handlers(name) {
    const el = document.getElementById(name);
    el.ontouchstart = start_handler;
    el.ontouchmove = move_handler;
    el.ontouchcancel = end_handler;
    el.ontouchend = end_handler;

    el.onmousedown = mouse_start_handler;
    el.onmousemove = mouse_move_handler;
    el.onmouseup = mouse_end_handler;
  }

  function init() {
    for (var row = 0; row < rows; row++) {
      for (var i = -(row >> 1); i < cols - (row >> 1); i++) {
        html += `
          <div id="knob-${row}-${i}"
            class="knob"
            style="left:${(i * 1.2 + row * 0.6625) * size}px; top:${(row - i * 0.05) * size}px;"
            data-note="">
            <span id="note-${row}-${i}" class="knob-label note">0</span>
            <span id="octave-${row}-${i}" class="knob-label octave">1</span>
          </div>`;
      }
    }
    document.getElementById('container').innerHTML = html;
  }

  function reset() {
    // take values from sliders
    const dx = +document.getElementById('slider-dx').value;
    const dy = +document.getElementById('slider-dy').value;
    const dz = (dy - dx + 12) % 12;
    document.getElementById('slider-dz').value = dz;
    const octaveOffset = +document.getElementById('slider-octave').value;
    const trail = +document.getElementById('slider-trail').value;
    // display values next to sliders
    document.getElementById('slider-dx-value').innerText = intervals[dx];
    document.getElementById('slider-dy-value').innerText = intervals[dy];
    document.getElementById('slider-dz-value').innerText = intervals[dz];
    document.getElementById('slider-trail-value').innerText = trail;
    document.getElementById('slider-octave-value').innerText = octaveOffset;

    for (var row = 0; row < rows; row++) {
      for (var i = -(row >> 1); i < cols - (row >> 1); i++) {
        const note = notes[(row * dy + i * dx + 12) % 12] ?? 'C';
        const octave = Math.floor((row * dy + i * dx) / 12) + octaveOffset;
        var color = note.length > 1 ? 'black' : 'white'
        let label = note.replace('B', 'H').replace('A#', 'B');
        const name = `knob-${row}-${i}`
        const el = document.getElementById(name);
        el.classList.remove('black', 'white');
        el.classList.add(color);
        el.setAttribute('data-note', note + octave);
        document.getElementById(`note-${row}-${i}`).innerText = label;
        document.getElementById(`octave-${row}-${i}`).innerText = `${octave}`;
        set_handlers(name);
      }
    }
    window.addEventListener('mouseup', mouse_end_handler)
    synth = new Tone.PolySynth(Tone.Synth, 3).toDestination();
  }

  function increase(id) {
    document.getElementById(id).value = +document.getElementById(id).value + 1;
    reset();
  }

  function decrease(id) {
    document.getElementById(id).value = +document.getElementById(id).value - 1;
    reset();
  }

  function start_handler(ev) {
    ev.preventDefault();
    noteDown(ev.changedTouches[0]?.identifier, ev.target);
  }

  function mouse_start_handler(ev) {
    ev.preventDefault();
    noteDown(1, ev.target);
  }

  function move_handler(ev) {
    ev.preventDefault();
    let pointers = [[ev.clientX, ev.clientY, 1]];
    if (ev.touches) {
      pointers = Array.from(ev.touches).map((touch) =>
        [touch.clientX, touch.clientY, touch.identifier]
      );
    }
    // Erfassungsposition ermitteln (Touch- oder Mausposition)
    // const x = ev.touches ? ev.touches[0].clientX : ev.clientX;
    // const y = ev.touches ? ev.touches[0].clientY : ev.clientY;
    // const touchId = ev.changedTouches[0]?.identifier;

    pointers.forEach(
      ([x, y, id]) => moveTo(x, y, id)
    );
  }

  function mouse_move_handler(ev) {
    if (!ev.buttons) return;
    ev.preventDefault();
    moveTo(ev.clientX, ev.clientY, 1)
  }

  function moveTo(x, y, id) {
    // Element unter der aktuellen Position holen
    const element = document.elementFromPoint(x, y);

    // Prüfen, ob das Element eine Note ist:
    if (element && element.classList.contains('knob')) {
      if (!playing.get(id).includes(element)) {
        noteDown(id, element);
      }
    }
  }

  function end_handler(ev) {
    ev.preventDefault();
    noteUp(ev.changedTouches[0]?.identifier);
  }

  function mouse_end_handler(ev) {
    noteUp(1);
  }

  function noteUp(touchId) {
    (playing.get(touchId) ?? []).forEach(stop);
    playing.delete(touchId);
  }

  function noteDown(touchId, elem) {
    const trail = +document.getElementById('slider-trail').value;

    if (!playing.get(touchId)) playing.set(touchId, []);
    const notes = playing.get(touchId);
    notes.push(elem);
    if (notes.length > trail) {
      stop(notes.shift());
    }
    playing.set(touchId, notes);

    elem.classList.add('playing');
    const note = elem.dataset.note;
    synth.triggerAttack(note, Tone.now());
  }

  function stop(noteElem) {
    noteElem.classList.remove('playing');
    synth.triggerRelease(noteElem.dataset.note, Tone.now());
  }

  init();
  reset();
</script>
</body>
</html>
